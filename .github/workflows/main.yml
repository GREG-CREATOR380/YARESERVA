name: YaReserva Automatisations

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  rappels-24h:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer rappels 24h avant
        run: |
          node << 'EOF'
          const tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          const dateStr = tomorrow.toISOString().split('T')[0];
          
          async function run() {
            const res = await fetch(
              `${{ secrets.SUPABASE_URL }}/rest/v1/reservations?date_rdv=eq.${dateStr}&statut=eq.confirmada&rappel_envoye=eq.false&select=*,salons(nom)`,
              { headers: {
                'apikey': '${{ secrets.SUPABASE_KEY }}',
                'Authorization': 'Bearer ${{ secrets.SUPABASE_KEY }}'
              }}
            );
            const rdvs = await res.json();
            console.log(`${rdvs.length} rappels à envoyer`);
            
            for (const rdv of rdvs) {
              if (rdv.client_telephone) {
                let phone = rdv.client_telephone.replace(/\s+/g,'').replace('+','');
                if (!phone.startsWith('57') && phone.length === 10) phone = '57' + phone;
                
                const msg = encodeURIComponent(
                  `⏰ Recordatorio!\n\nMañana tienes cita en ${rdv.salons?.nom}:\n💅 ${rdv.service}\n⏰ ${rdv.heure_rdv?.slice(0,5)}\n\n¡Te esperamos! 😊`
                );
                
                await fetch(`https://api.callmebot.com/whatsapp.php?phone=${phone}&text=${msg}&apikey=${{ secrets.CMB_APIKEY }}`);
                
                // Marquer comme envoyé
                await fetch(
                  `${{ secrets.SUPABASE_URL }}/rest/v1/reservations?id=eq.${rdv.id}`,
                  { method: 'PATCH',
                    headers: {
                      'apikey': '${{ secrets.SUPABASE_KEY }}',
                      'Authorization': 'Bearer ${{ secrets.SUPABASE_KEY }}',
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ rappel_envoye: true })
                  }
                );
                console.log(`Rappel envoyé à ${rdv.client_nom}`);
              }
            }
          }
          run().catch(console.error);
          EOF

  relance-inactifs:
    runs-on: ubuntu-latest
    steps:
      - name: Relancer clients inactifs lundi 8h
        run: |
          node << 'EOF'
          const hace30 = new Date();
          hace30.setDate(hace30.getDate() - 30);
          const hace30Str = hace30.toISOString().split('T')[0];
          
          async function run() {
            const resS = await fetch(
              `${{ secrets.SUPABASE_URL }}/rest/v1/salons?select=id,nom,slug`,
              { headers: {
                'apikey': '${{ secrets.SUPABASE_KEY }}',
                'Authorization': 'Bearer ${{ secrets.SUPABASE_KEY }}'
              }}
            );
            const salons = await resS.json();
            
            for (const salon of salons) {
              const resC = await fetch(
                `${{ secrets.SUPABASE_URL }}/rest/v1/clients?salon_id=eq.${salon.id}&derniere_visite=lt.${hace30Str}&select=*`,
                { headers: {
                  'apikey': '${{ secrets.SUPABASE_KEY }}',
                  'Authorization': 'Bearer ${{ secrets.SUPABASE_KEY }}'
                }}
              );
              const clients = await resC.json();
              
              for (const c of clients) {
                if (c.telephone) {
                  let phone = c.telephone.replace(/\s+/g,'').replace('+','');
                  if (!phone.startsWith('57') && phone.length === 10) phone = '57' + phone;
                  const msg = encodeURIComponent(`Hola ${c.nom}! 👋\n\nTe echamos de menos en ${salon.nom}! 😊\n\nReserva aquí: https://greg-creator380.github.io/YARESERVA/reserva.html?salon=${salon.slug}\n\n¡Te esperamos! 💅`);
                  await fetch(`https://api.callmebot.com/whatsapp.php?phone=${phone}&text=${msg}&apikey=${{ secrets.CMB_APIKEY }}`);
                  await new Promise(r => setTimeout(r, 2000));
                }
              }
            }
          }
          run().catch(console.error);
          EOF
